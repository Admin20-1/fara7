<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سها | ملكة الـ26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background: 
                radial-gradient(ellipse at 15% 10%, rgba(255, 215, 120, 0.25) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 90%, rgba(60, 140, 90, 0.2) 0%, transparent 50%),
                linear-gradient(165deg, #1a3c2e 0%, #2d5a45 35%, #3d6b52 60%, #1e4a38 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow: hidden;
            position: relative;
        }
        /* Soft floating lily / sparkles */
        .spark {
            position: absolute;
            font-size: 16px;
            opacity: 0;
            animation: floatSpark 6s ease-in-out infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255, 215, 100, 0.5));
        }

        @keyframes floatSpark {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0.7); }
            40%, 60% { opacity: 0.8; transform: translateY(-12px) scale(1); }
        }

        /* Card */
        .card {
            background: linear-gradient(175deg, 
                #f8f4e8 0%, 
                #f0e8d4 50%, 
                #e8dcc0 100%);
            border-radius: 24px;
            padding: 36px 28px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        /* Gold elegant border */
        .card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 27px;
            background: linear-gradient(
                135deg,
                #c9a227 0%,
                #f0d060 20%,
                #8b7355 40%,
                #c9a227 60%,
                #f0d060 80%,
                #c9a227 100%
            );
            background-size: 200% 200%;
            animation: goldShine 9s ease infinite;
            z-index: -1;
        }

        @keyframes goldShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Top green accent bar */
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #2d6b4a, transparent);
            border-radius: 0 0 4px 4px;
        }

        .ornament {
            color: #8b7355;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 14px;
            opacity: 0.7;
        }

        .princess-icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: inline-block;
            animation: softBounce 3.5s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        @keyframes softBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .queen-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #5a4a30;
            letter-spacing: 2.5px;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .queen-name {
            font-size: 1.5rem;
            font-weight: 900;
            color: #2d4a35;
            background: linear-gradient(135deg, #f0d060 0%, #e8c840 100%);
            padding: 6px 22px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 16px;
            border: 1.5px solid #8b7355;
            box-shadow: 0 4px 12px rgba(201, 162, 39, 0.3);
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 900;
            color: #2d3a2e;
            margin-bottom: 4px;
        }

        .date {
            font-size: 0.9rem;
            color: #5a6a55;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 26px;
        }

        .box {
            background: linear-gradient(180deg, #fffef8 0%, #f5f0e0 100%);
            border-radius: 12px;
            padding: 11px 5px;
            min-width: 66px;
            border: 1.5px solid rgba(45, 107, 74, 0.25);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18%;
            right: 18%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a227, transparent);
        }

        .box .num {
            font-size: 1.8rem;
            font-weight: 900;
            color: #2d4a35;
            display: block;
            line-height: 1.15;
        }

        .box .lbl {
            font-size: 0.7rem;
            color: #5a6a55;
            font-weight: 700;
            margin-top: 2px;
            display: block;
        }

        .wish {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2d3a2e;
            line-height: 1.65;
        }

        .wish .heart {
            color: #c45c5c;
            display: inline-block;
            animation: beat 1.6s ease-in-out infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .flourish {
            margin-top: 18px;
            font-size: 14px;
            color: #8b7355;
            opacity: 0.65;
            letter-spacing: 3px;
        }

        @media (max-width: 400px) {
            .card {
                padding: 30px 16px 34px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .queen-name {
                font-size: 1.25rem;
                padding: 5px 16px;
            }
            .box {
                min-width: 56px;
                padding: 9px 3px;
            }
            .box .num {
                font-size: 1.5rem;
            }
            .countdown {
                gap: 6px;
            }
            .princess-icon {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <!-- Soft magical elements -->
    <div class="spark" style="top: 10%; left: 8%; animation-delay: 0s;">✨</div>
    <div class="spark" style="top: 18%; right: 10%; animation-delay: 1.5s;">🌟</div>
    <div class="spark" style="bottom: 15%; left: 12%; animation-delay: 2.8s;">✨</div>
    <div class="spark" style="bottom: 22%; right: 9%; animation-delay: 0.7s;">💫</div>
    <div class="spark" style="top: 42%; left: 4%; animation-delay: 3.5s;">🌿</div>
    <div class="spark" style="top: 50%; right: 5%; animation-delay: 2s;">🍃</div>
    <div class="spark" style="top: 8%; left: 50%; animation-delay: 1s;">✨</div>

    <div class="card">
        <div class="ornament">✦ • • • ✦</div>

        <div class="princess-icon">🐸👑</div>

        <div class="queen-label">THE PRINCESS</div>
        <div class="queen-name">ملكة الـ ٢٦</div>

        <h1>عيد ميلاد سها</h1>
        <p class="date">٩ أغسطس ٢٠٢٦</p>

        <div class="countdown" id="countdown">
            <div class="box">
                <span class="num" id="days">00</span>
                <span class="lbl">يوم</span>
            </div>
            <div class="box">
                <span class="num" id="hours">00</span>
                <span class="lbl">ساعة</span>
            </div>
            <div class="box">
                <span class="num" id="minutes">00</span>
                <span class="lbl">دقيقة</span>
            </div>
            <div class="box">
                <span class="num" id="seconds">00</span>
                <span class="lbl">ثانية</span>
            </div>
        </div>

        <p class="wish">
            كل سنة وأنتِ طيبة<br>
            <span class="heart">♥</span> يا ملكة الـ ٢٦ <span class="heart">♥</span>
        </p>

        <div class="flourish">🌿 ✦ 🍃</div>
    </div>

    <script>
        const targetDate = new Date(2026, 7, 9, 0, 0, 0).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                document.getElementById('countdown').innerHTML = `
                    <div style="font-size: 1.25rem; font-weight: 900; color: #2d3a2e; padding: 10px; line-height: 1.55;">
                        🎉 كل سنة وأنتِ طيبة<br>
                        <span style="font-size: 1.05rem;">يا ملكة الـ ٢٦ ♥</span>
                    </div>
                `;
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
