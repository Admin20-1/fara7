<div dir="rtl" style="font-family: var(--font-sans); text-align:center; padding: 1.5rem 0;">
  <div style="font-size:14px; color:var(--text-secondary); margin-bottom:6px;">فرح يوسف وسها</div>
  <div style="font-size:16px; color:var(--text-primary); margin-bottom:24px;">30 أغسطس 2026 • قاعة كريستال بالاس، نادي اتحاد الشرطة • 7:30 مساءً</div>

  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:520px; margin:0 auto;">
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem;">
      <div id="d" style="font-size:28px; font-weight:500; color:var(--text-accent);">--</div>
      <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">يوم</div>
    </div>
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem;">
      <div id="h" style="font-size:28px; font-weight:500; color:var(--text-accent);">--</div>
      <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">ساعة</div>
    </div>
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem;">
      <div id="m" style="font-size:28px; font-weight:500; color:var(--text-accent);">--</div>
      <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">دقيقة</div>
    </div>
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem;">
      <div id="s" style="font-size:28px; font-weight:500; color:var(--text-accent);">--</div>
      <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">ثانية</div>
    </div>
  </div>

  <div style="margin-top:22px; font-size:14px; color:var(--text-secondary);" id="msg"></div>
</div>

<script>
const target = new Date('2026-08-30T19:30:00+03:00').getTime();
function tick(){
  const now = Date.now();
  const diff = target - now;
  if(diff <= 0){
    document.getElementById('d').textContent='0';
    document.getElementById('h').textContent='0';
    document.getElementById('m').textContent='0';
    document.getElementById('s').textContent='0';
    document.getElementById('msg').textContent = 'مبروك! الفرح النهارده';
    return;
  }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=h;
  document.getElementById('m').textContent=m;
  document.getElementById('s').textContent=s;
}
tick();
setInterval(tick,1000);
</script>
